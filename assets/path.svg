<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="900" height="170" role="img" aria-label="My learning path: C and Java foundations, Python and ML basics, clustering and desktop ML apps, reinforcement learning, SRP next semester" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="90" y1="0" x2="810" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="898" height="168" rx="16" fill="#0d1117" stroke="#30363d"/>

  <!-- track -->
  <line x1="90" y1="70" x2="810" y2="70" stroke="url(#line)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- nodes -->
  <g fill="#0d1117" stroke-width="3">
    <circle cx="90"  cy="70" r="10" stroke="#6366f1"/>
    <circle cx="270" cy="70" r="10" stroke="#8b7cf6"/>
    <circle cx="450" cy="70" r="10" stroke="#a78bfa"/>
    <circle cx="630" cy="70" r="10" stroke="#c77dd6"/>
    <circle cx="810" cy="70" r="10" stroke="#ec4899" stroke-dasharray="4 3"/>
  </g>

  <!-- labels -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e5e7eb" text-anchor="middle">
    <text x="90"  y="112">C and Java</text>
    <text x="90"  y="132" fill="#9ca3af">foundations</text>
    <text x="270" y="112">Python and</text>
    <text x="270" y="132" fill="#9ca3af">ML basics</text>
    <text x="450" y="112">Clustering and</text>
    <text x="450" y="132" fill="#9ca3af">desktop ML apps</text>
    <text x="630" y="112">Reinforcement</text>
    <text x="630" y="132" fill="#9ca3af">learning</text>
    <text x="810" y="112">SRP</text>
    <text x="810" y="132" fill="#9ca3af">next semester</text>
  </g>

  <!-- traveller -->
  <g>
    <circle r="16" fill="url(#glow)"/>
    <circle r="6" fill="#ffffff"/>
    <animateMotion dur="9s" repeatCount="indefinite" calcMode="linear"
                   keyPoints="0;1;1" keyTimes="0;0.8;1" path="M90,70 L810,70"/>
  </g>
</svg>
